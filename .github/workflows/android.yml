
name: TABOLAND Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node.js 22 kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Android SDK yolunu ayarla
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"


      - name: V5 oyunu ve yeni muzik dosyasini hazirla
        shell: bash
        env:
          THEME_URL: "https://d2ol7oe51mr4n9.cloudfront.net/user_3DzTtgkqSqW5HmuTA87oF2WEVU4/95bd70ec-867d-4dda-b316-596b5a0ec7c3.mp3"
        run: |
          set -euo pipefail
          mkdir -p www/music
          if [ ! -f www/music/taboland-theme.mp3 ]; then
            curl --fail --location --retry 3 --retry-delay 3 --output www/music/taboland-theme.mp3 "$THEME_URL"
          fi
          echo "7610cc4991bd3f3abb4aef9e9e8fbf3a0c513bb4e2b3d2343a1de7d915cdf697  www/music/taboland-theme.mp3" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          h=Path('www/index.html')
          s=h.read_text(encoding='utf-8')
          a='mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH'
          b='mode:Phaser.Scale.EXPAND,autoCenter:Phaser.Scale.CENTER_BOTH'
          if a in s: s=s.replace(a,b,1)
          if b not in s: raise RuntimeError('Phaser scale configuration was not found')
          a='render:{antialias:!0,roundPixels:!1,maxTextures:1}'
          b='fps:{target:60,min:30,smoothStep:true,forceSetTimeOut:false},'+a
          if b not in s:
              if a not in s: raise RuntimeError('Render configuration not found')
              s=s.replace(a,b,1)
          css='''
          /* TABOLAND v5: full-bleed responsive screen without stretching controls. */
          html,body{min-height:100%;min-height:100dvh}
          #game{width:100vw;height:100vh;height:100dvh;background:#e9ece4;overflow:hidden;touch-action:none}
          #game canvas{image-rendering:auto;display:block}
          #tl-lobby{background-color:#e6e9dc;background-image:var(--lobby-bg);background-position:center;background-size:cover;background-repeat:no-repeat;isolation:isolate;overflow:hidden}
          #tl-lobby:before{inset:-10px;z-index:0;filter:blur(18px) saturate(.97);opacity:.56}
          #tl-lobby .tl-stage{z-index:1;flex-shrink:0;max-width:100vw;max-height:100dvh}
          @supports(height:100dvh){#tl-rotate{min-height:100dvh}}
          #tl-lobby .tl-tools{right:max(3%,env(safe-area-inset-right));top:max(3%,env(safe-area-inset-top))}
          '''
          marker='<script src="music/taboland-music.js"></script></head>'
          if '/* TABOLAND v5: full-bleed' not in s:
              if marker not in s: raise RuntimeError('Music script / head marker missing')
              s=s.replace(marker,'<style>'+css+'</style>'+marker,1)
          s=s.replace("gap:'Sonraki şarkı için 15 sn ara'","gap:'Aynı müzik 15 sn sonra tekrar başlayacak'")
          s=s.replace("gap:'15-second break'","gap:'Music repeats after a 15-second break'")
          h.write_text(s,encoding='utf-8')
          j=Path('www/music/taboland-music.js')
          m=j.read_text(encoding='utf-8')
          old="const TRACKS = ['music/taboland-1.mp3', 'music/taboland-2.mp3'];"
          new="const TRACKS = ['music/taboland-theme.mp3'];"
          if old in m: m=m.replace(old,new,1)
          if new not in m: raise RuntimeError('Old music track definition not found')
          m=m.replace('/* TABOLAND v3 - one persistent music player shared by all scenes. */','/* TABOLAND v5 - persistent user theme, repeat after 15 seconds. */')
          m=m.replace('let trackIndex = Math.random() < 0.5 ? 0 : 1;','let trackIndex = 0;')
          m=m.replace('trackTimer = setTimeout(() => openTrack(1 - index), GAP_MS);','trackTimer = setTimeout(() => openTrack(0), GAP_MS);')
          m=m.replace('get trackNumber() {return trackIndex + 1;},','get trackNumber() {return 1;},')
          if 'const GAP_MS = 15000;' not in m or 'openTrack(0), GAP_MS' not in m: raise RuntimeError('Music loop mismatch')
          j.write_text(m,encoding='utf-8')
          for name in ('taboland-1.mp3','taboland-2.mp3'):
              p=Path('www/music')/name
              if p.exists(): p.unlink()
          print('V5 ready; html bytes',h.stat().st_size,'audio bytes',Path('www/music/taboland-theme.mp3').stat().st_size)
          PY

      - name: GunceI V5'i depoya kaydet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html www/music/
          if ! git diff --cached --quiet; then
            git commit -m "TABOLAND V5: responsive screens and new 15-second-loop theme [skip ci]"
            git push origin HEAD:main
          fi

      - name: Node paketlerini kur
        run: npm ci

      - name: Capacitor senkronizasyonu
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: TABOLAND-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
